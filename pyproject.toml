[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-review"
dynamic = ["version"]
description = "EMG Review: import-first offline viewer and interval annotator for 8-channel sEMG recordings"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
emg-review = "emg_review.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "emg_review.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
